plans:
  - name: Free
    description: >-
      The free tier allows landlords and property managers to post rental
      listings at no cost. Listings are distributed across Zumper's network
      including PadMapper, ChatGPT, Microsoft Bing, and Realtor.com. Includes
      basic portfolio dashboard, lead management, and access to tenant
      application tools. Up to 5 free listings per month with standard
      placement.
    url: https://www.zumper.com/manage
    price: 0.00
    unit: monthly
    pricingModel: free-tier
    rateLimits:
      - type: listings
        limit: 5
        period: monthly
    features:
      - Basic listing distribution
      - Access to Zumper network syndication
      - PadMapper, ChatGPT, Bing syndication
      - Standard search placement
      - Basic portfolio dashboard
      - Lead management
      - Tenant application access
      - Online rent payment collection
      - Digital leasing tools

  - name: Premium Starter
    description: >-
      Entry-level premium plan providing enhanced listing visibility and
      promoted search rankings for up to 5 listings. Includes 10x more exposure
      than standard listings, verification badges, automatic posting to partner
      sites, and performance reports.
    url: https://www.zumper.com/manage
    price: 10.00
    unit: monthly
    pricingModel: subscription
    rateLimits:
      - type: listings
        limit: 5
        period: monthly
    features:
      - 10x more exposure than standard listings
      - Promoted search rankings
      - Verification badges
      - Automatic posting to partner sites
      - Performance reports
      - Priority placement in search results

  - name: Premium 10
    description: >-
      Premium plan for growing landlords managing up to 10 listings. Provides
