aid: zumper
name: Zumper
description: >-
  Zumper is a rental listing marketplace that connects renters with landlords
  and property managers across the United States and Canada. The platform
  provides access to apartment listings, property data, rental price insights,
  and tenant application management. Zumper offers a REST API and syndication
  feeds enabling property management software providers and partners to publish
  listings, retrieve rental market data, and integrate tenant screening and
  leasing workflows. The platform processes over 76 million site visits annually
  and syndicates listings across PadMapper, ChatGPT, Microsoft Bing, and
  Realtor.com.
