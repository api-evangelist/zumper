    name: Zumper API
    description: >-
      The Zumper API provides access to rental listings, property data, rental
      price insights, and tenant application management. Partners and property
      management software providers can use the API to syndicate listings to
      Zumper, retrieve rental market intelligence, access tenant screening
      powered by TransUnion, and manage leasing workflows. The API supports
      listing publication, lead management, rental trend data, and integration
      with Zumper's PowerLeads AI engine.
